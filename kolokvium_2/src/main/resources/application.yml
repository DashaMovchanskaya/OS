spring:
  application:
    name: todo-api

  datasource:
    url: jdbc:sqlite:todo.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop  # или update для сохранения данных
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect
        connection:
          autocommit: false

  data:
    jpa:
      repositories:
        enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    org.example: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE