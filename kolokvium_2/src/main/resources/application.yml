server:
  port: 8080

spring:
  main:
    web-application-type: reactive

  application:
    name: todo-api-gateway

  cloud:
    gateway:
      routes:
        - id: todo-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/tasks/**
          filters:
            - name: AuthenticationFilter
            - StripPrefix=1

        - id: public-endpoints
          uri: http://localhost:8081
          predicates:
            - Path=/health, /status

  datasource:
    url: jdbc:h2:mem:todo_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.example: INFO